name: Terraform Azure Deployment

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================================================
  # JOB 1 - Terraform Plan
  # =========================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lab

    steps:

      # Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # Verify Azure
      - name: Azure Account
        run: az account show

      # Terraform Init
      - name: Terraform Init
        run: terraform init

      # Terraform Format
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Upload plan for Apply job
      - name: Upload Terraform Plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ./lab/tfplan


  # =========================================================
  # JOB 2 - Terraform Apply
  # =========================================================
  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan

    # Apply ONLY after push/merge to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # GitHub Environment
    environment:
      name: production

    defaults:
      run:
        working-directory: ./lab

    steps:

      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # Verify Azure
      - name: Azure Account
        run: az account show

      # Terraform Init
      - name: Terraform Init
        run: terraform init

      # Download Terraform Plan
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ./lab

      # Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan